<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>竹知了 3D 仿真</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07120e;color:#eef7ef;font-family:system-ui,"Microsoft YaHei",sans-serif}#app{position:fixed;inset:0}.hud{position:fixed;inset:0;padding:14px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0;color:#aebfb3;font-size:12px}.panel{pointer-events:auto;background:#0a1913cc;border:1px solid #d9e8d722;border-radius:14px;padding:10px;backdrop-filter:blur(12px)}.stats{display:flex;gap:7px}.stat{min-width:85px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#9db1a3}.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d8b86a55;background:#12271d;color:#eef7ef;border-radius:10px;padding:9px 11px;cursor:pointer}.primary{background:#d8b86a;color:#182014}.challenge{min-width:250px}.bar{height:6px;background:#fff2;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#d8b86a}.mode{font-size:11px;color:#a9b8ad;margin-top:6px}.tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 18px;background:#06100cf2;border:1px solid #fff2;border-radius:15px;text-align:center;opacity:0;transition:.3s;pointer-events:none}.tip.show{opacity:1}.tip small{display:block;color:#9db1a3;margin-top:5px}@media(max-width:650px){.hud{padding:9px}.brand h1{font-size:18px}.stats{position:absolute;top:58px;left:9px;right:9px}.stat{min-width:0;flex:1}.bottom{flex-direction:column}.challenge{min-width:0}.btn{flex:1}.top{display:block}}
</style></head><body><div id="app"></div><video id="cam" playsinline autoplay muted style="display:none"></video>
<div class="hud"><div class="top"><div class="brand"><h1>竹知了 · 3D 仿真</h1><p>搓动竹签，让“哇——哇——”随转速升高、变响</p></div><div class="stats"><div class="panel stat"><b id="rpm">0</b><span>RPM</span></div><div class="panel stat"><b id="freq">0</b><span>Hz</span></div><div class="panel stat"><b id="best">0.0s</b><span>最佳鸣叫</span></div></div></div>
<div class="bottom"><div class="panel challenge"><b>挑战：连续鸣叫 10 秒</b><div class="bar"><i id="bar"></i></div><div id="challenge" class="mode">达到约 70 RPM 开始计时</div></div><div class="panel"><div class="buttons"><button class="btn primary" id="sound">🔊 开启声音</button><button class="btn" id="camera">✋ 手势模式</button><button class="btn" id="motion">📱 摇一摇</button><button class="btn" id="reset">↺ 重置</button></div><div id="status" class="mode">鼠标/触摸画圈搓动；拖拽空白处也可旋转视角</div></div></div></div>
<div id="tip" class="tip"><b>🔊 点击开启声音</b><small>浏览器需要用户手势才能启动 Web Audio</small></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
<script>
const S=new THREE.Scene();S.background=new THREE.Color(0x07120e);S.fog=new THREE.FogExp2(0x07120e,.045);
const C=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);C.position.set(2.8,1.8,4.4);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.querySelector("#app").appendChild(R.domElement);
const O=new THREE.OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,.3,0);O.minDistance=2.2;O.maxDistance=7;
S.add(new THREE.HemisphereLight(0xd7eadc,0x18261d,2));let L=new THREE.DirectionalLight(0xffedc2,3);L.position.set(3,4,3);L.castShadow=true;S.add(L);
const G=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x0b1b14,roughness:.95}));G.rotation.x=-Math.PI/2;G.position.y=-1.35;S.add(G);
const toy=new THREE.Group();toy.position.y=.1;S.add(toy);
const bamboo=new THREE.MeshStandardMaterial({color:0xb98a46,roughness:.7}),light=new THREE.MeshStandardMaterial({color:0xd2ad63,roughness:.65}),dark=new THREE.MeshStandardMaterial({color:0x76512a,roughness:.8}),cord=new THREE.MeshStandardMaterial({color:0x30241b}),mem=new THREE.MeshStandardMaterial({color:0xd7c08b,roughness:.9,side:THREE.DoubleSide});
let stick=new THREE.Mesh(new THREE.CylinderGeometry(.055,.075,2.6,18),light);stick.position.y=.05;toy.add(stick);let grip=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.58,18),dark);grip.position.y=-.88;toy.add(grip);
let tube=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.82,32,1,true),bamboo);tube.rotation.z=Math.PI/2;tube.position.y=1;toy.add(tube);
for(const x of[-.41,.41]){let q=new THREE.Mesh(new THREE.TorusGeometry(.48,.045,12,32),dark);q.rotation.y=Math.PI/2;q.position.x=x;q.position.y=1;toy.add(q)}
let membrane=new THREE.Mesh(new THREE.CircleGeometry(.4,40),mem);membrane.rotation.y=Math.PI/2;membrane.position.set(.415,1,0);toy.add(membrane);
let knot=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),cord);knot.position.set(.43,1,0);toy.add(knot);
let spin=new THREE.Group();spin.position.set(.44,1,1.65);toy.add(spin);
let bm=new THREE.MeshStandardMaterial({color:0xcda35d,roughness:.65,side:THREE.DoubleSide});
for(const y of[-.15,.15]){let b=new THREE.Mesh(new THREE.BoxGeometry(.055,.9,.025),bm);b.position.y=y;b.rotation.z=y>0?.18:-.18;spin.add(b)}spin.add(new THREE.Mesh(new THREE.SphereGeometry(.075,14,10),dark));
let string=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x4b3623}));toy.add(string);
let ghosts=[];for(let i=0;i<9;i++){let g=spin.clone();g.children.forEach(x=>{if(x.material){x.material=x.material.clone();x.material.transparent=true;x.material.opacity=0}});S.add(g);ghosts.push(g)}
let glow=new THREE.Mesh(new THREE.RingGeometry(.62,.68,64),new THREE.MeshBasicMaterial({color:0x8fca7a,transparent:true,opacity:0,side:THREE.DoubleSide}));glow.rotation.x=Math.PI/2;S.add(glow);

let w=0,ang=0,last=performance.now(),drag=null,MAX=105,best=+localStorage.zhizhiliaoBest||0,call=0;
function impulse(v){w=THREE.MathUtils.clamp(w+v*2.0,0,MAX)}
R.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};audio();R.domElement.setPointerCapture?.(e.pointerId)};
R.domElement.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y,rx=e.clientX-innerWidth/2,ry=e.clientY-innerHeight/2,t=(-ry*dx+rx*dy)/(Math.hypot(rx,ry)+80);if(Math.hypot(dx,dy)>1)impulse(Math.abs(t)*1.7);drag.x=e.clientX;drag.y=e.clientY};
["pointerup","pointercancel","pointerleave"].forEach(x=>R.domElement.addEventListener(x,()=>drag=null));
function physics(dt){let d=.78*w+.0105*w*w;w=Math.max(0,w-d*dt);ang+=w*dt;spin.rotation.z=ang;let st=Math.min(1,w/65),p=new THREE.Vector3(.44,1,1.25+st*.55);spin.position.copy(p);string.geometry.setFromPoints([new THREE.Vector3(.44,1,0),p]);glow.position.copy(p);glow.material.opacity=.03+.14*st;ghosts.forEach((g,i)=>{g.position.copy(p);g.rotation.z=ang-(i+1)*.14*w;g.children.forEach(c=>c.material&&(c.material.opacity=st*(1-i/ghosts.length)*.16))})}
let ac,master,osc,sub,noise,ng,b1,b2,b3,lfo,lg;
function audio(){if(ac){ac.resume();return}ac=new AudioContext();master=ac.createGain();master.gain.value=.0001;master.connect(ac.destination);
osc=ac.createOscillator();osc.type="sawtooth";let og=ac.createGain();og.gain.value=.32;osc.connect(og);[1050,2150,3350].forEach((f,i)=>{let b=ac.createBiquadFilter();b.type="bandpass";b.frequency.value=f;b.Q.value=4+i;b1||(b1=b);i==1?b2=b:i==2?b3=b:0;og.connect(b);b.connect(master)});
sub=ac.createOscillator();sub.type="sine";let sg=ac.createGain();sg.gain.value=.12;sub.connect(sg).connect(master);lfo=ac.createOscillator();lfo.frequency.value=32;lg=ac.createGain();lg.gain.value=.1;lfo.connect(lg);lg.connect(sg.gain);
noise=ac.createBufferSource();let buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise.buffer=buf;noise.loop=true;ng=ac.createGain();ng.gain.value=.02;let nb=ac.createBiquadFilter();nb.type="bandpass";nb.frequency.value=1800;nb.Q.value=1.3;noise.connect(nb).connect(ng).connect(master);
osc.start();sub.start();lfo.start();noise.start();ac.resume()}
function sound(){if(!ac)return;let rpm=w*60/(2*Math.PI),on=Math.max(0,Math.min(1,(rpm-48)/55)),f=55+Math.min(140,rpm*.115),t=ac.currentTime;osc.frequency.setTargetAtTime(f,t,.025);sub.frequency.setTargetAtTime(f*.52,t,.03);b1.frequency.setTargetAtTime(900+f*2.1,t,.04);b2.frequency.setTargetAtTime(1750+f*2.8,t,.04);b3.frequency.setTargetAtTime(2800+f*4.2,t,.04);ng.gain.setTargetAtTime(.012+.065*on,t,.04);master.gain.setTargetAtTime(.0001+.30*on*on,t,.035)}
function challenge(dt){let rpm=w*60/(2*Math.PI);if(rpm>70)call+=dt;else if(rpm<45)call=Math.max(0,call-dt*2);if(call>best){best=call;localStorage.zhizhiliaoBest=best.toFixed(2);bestEl.textContent=best.toFixed(1)+"s"}bar.style.width=Math.min(100,call*10)+"%";challengeEl.textContent=call>=10?"🎉 挑战完成！继续冲击纪录":"连续鸣叫 "+call.toFixed(1)+" / 10.0 秒"}
const rpmEl=document.querySelector("#rpm"),freqEl=document.querySelector("#freq"),bestEl=document.querySelector("#best"),bar=document.querySelector("#bar"),challengeEl=document.querySelector("#challenge"),status=document.querySelector("#status");
bestEl.textContent=best.toFixed(1)+"s";
document.querySelector("#sound").onclick=()=>{audio();document.querySelector("#sound").textContent="🔊 声音已开启"};
document.querySelector("#reset").onclick=()=>{w=0;call=0;ang=0};
let motion=false,lastA=null;document.querySelector("#motion").onclick=async()=>{audio();if(typeof DeviceMotionEvent?.requestPermission==="function"){if(await DeviceMotionEvent.requestPermission()!=="granted")return}motion=true;status.textContent="📱 摇一摇已开启 · 小幅甩动手机驱动竹知了"};
addEventListener("devicemotion",e=>{if(!motion)return;let a=e.accelerationIncludingGravity;if(!a)return;let m=Math.hypot(a.x||0,a.y||0,a.z||0);if(lastA!=null&&Math.abs(m-lastA)>1)w=Math.min(MAX,w+Math.abs(m-lastA)*2.3);lastA=m});
let hc=false,hcam=null;document.querySelector("#camera").onclick=async()=>{audio();if(hc){hcam?.stop();hc=false;document.querySelector("#camera").textContent="✋ 手势模式";return}try{let v=document.querySelector("#cam");v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}});await v.play();let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.55});let hp=null;hands.onResults(r=>{if(!r.multiHandLandmarks?.length)return;let p=r.multiHandLandmarks[0][8],q=r.multiHandLandmarks[0][5],x=(p.x+q.x)/2,y=(p.y+q.y)/2,t=performance.now();if(hp){let dx=x-hp.x,dy=y-hp.y,sp=Math.hypot(dx,dy)/Math.max(.012,(t-hp.t)/1000);if(sp>.3)w=Math.min(MAX,w+sp*2)}hp={x,y,t}});hcam=new Camera(v,{onFrame:async()=>hands.send({image:v}),width:640,height:480});hcam.start();hc=true;document.querySelector("#camera").textContent="✋ 关闭手势";status.textContent="✋ 手势已开启 · 用手掌/食指做搓圈动作"}catch(e){status.textContent="摄像头启动失败：请在 HTTPS 或 localhost 下运行并允许权限"}};
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;physics(dt);sound();challenge(dt);let rpm=w*60/(2*Math.PI);rpmEl.textContent=Math.round(rpm);freqEl.textContent=Math.round(55+rpm*.115);O.update();R.render(S,C);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener("resize",()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector("#tip").classList.add("show"),600);setTimeout(()=>document.querySelector("#tip").classList.remove("show"),4000);
</script></body></html>
